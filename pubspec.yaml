name: events_app_trueattempt
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2

  # State Management
  flutter_riverpod: ^2.5.1
  
  # UI & Utilities
  google_fonts: ^6.2.1
  intl: ^0.19.0
  card_swiper: ^3.0.1

  # For Push Notifications
  firebase_messaging: ^15.2.10
  
  # For QR Code Generation (for speakers)
  qr_flutter: ^4.1.0
  
  # For QR Code Scanning (for attendees)
  mobile_scanner: ^3.5.6
  
  # For opening Live Stream links
  url_launcher: ^6.2.1
  
  # For YouTube video player
  youtube_player_flutter: ^9.0.3

  #for remote configuration of app
  firebase_remote_config: ^5.5.0

  #animations
  flutter_staggered_animations: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Assets configuration
  assets:
    - assets/images/
