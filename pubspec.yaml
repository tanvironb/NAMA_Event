name: events_app_trueattempt
description: "A new Flutter project."

publish_to: "none"

version: 0.1.5+14

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.2.10
  firebase_remote_config: ^5.5.0
  cloud_functions: ^5.6.2

  # For saving scanned users as phone contacts
  flutter_contacts: ^2.1.0

  # State Management
  flutter_riverpod: ^2.5.1

  # UI & Utilities
  google_fonts: ^6.2.1
  intl: ^0.19.0
  card_swiper: ^3.0.1
  flutter_svg: ^2.0.10+1
  table_calendar: ^3.0.9
  flutter_staggered_animations: ^1.1.1
  collection: ^1.17.2
  timeago: ^3.7.0
  shared_preferences: ^2.2.2
  cached_network_image: ^3.4.1
  package_info_plus: ^8.0.0
  font_awesome_flutter: ^11.0.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: 3.5.7
  screen_brightness: ^2.1.11

  # Media and links
  url_launcher: ^6.2.1
  youtube_player_flutter: ^9.0.3
  image_picker: ^1.2.2
  image_cropper: ^8.0.2

  # PDF, sharing and storage
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^10.1.3
  path_provider: ^2.1.5

  # Charts and analytics
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true

  # Removes transparency from iOS app icons.
  remove_alpha_ios: true

  # Main icon image
  image_path: "assets/images/textlogo.png"

  # Android adaptive icon
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/textlogo.png"

  # Keeps the logo inside the Android adaptive icon safe area.
  adaptive_icon_foreground_inset: 35

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/tmp/
    - assets/icons/